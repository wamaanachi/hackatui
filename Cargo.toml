[package]
name = "hackatui"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "7.0.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", features = ["json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
